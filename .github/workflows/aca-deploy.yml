name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

env:
  RESOURCE_GROUP: pls-demo-rg
  LOCATION: eastus
  ACR_NAME: plsdemoregistry
  ACA_ENV: pls-demo-aca
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group (if needed)
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"

      - name: Create ACR (if needed)
        run: |
          az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1 \
            || az acr create --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --sku Basic

      - name: Create ACA environment (if needed)
        run: |
          az containerapp env show --name "$ACA_ENV" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1 \
            || az containerapp env create --name "$ACA_ENV" --resource-group "$RESOURCE_GROUP" --location "$LOCATION"

      - name: Login to ACR (for build/push)
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_LOGIN_SERVER }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build & Push images
        run: |
          docker build -t "${{ secrets.ACR_LOGIN_SERVER }}/pls-document-service:${IMAGE_TAG}" -f services/document-service/Dockerfile .
          docker build -t "${{ secrets.ACR_LOGIN_SERVER }}/pls-orchestrator-service:${IMAGE_TAG}" -f services/orchestrator-service/Dockerfile .
          docker build -t "${{ secrets.ACR_LOGIN_SERVER }}/pls-summarization-service:${IMAGE_TAG}" -f services/summarization-service/Dockerfile .
          docker build -t "${{ secrets.ACR_LOGIN_SERVER }}/pls-dockling-service:${IMAGE_TAG}" -f services/docling-service/Dockerfile .
          docker build -t "${{ secrets.ACR_LOGIN_SERVER }}/pls-web:${IMAGE_TAG}" -f apps/web/Dockerfile .
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/pls-document-service:${IMAGE_TAG}"
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/pls-orchestrator-service:${IMAGE_TAG}"
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/pls-summarization-service:${IMAGE_TAG}"
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/pls-dockling-service:${IMAGE_TAG}"
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/pls-web:${IMAGE_TAG}"

      # 0) Deploy Docling (internal)
      - name: Deploy/Update Docling Service (internal)
        run: |
          set -e
          APP_NAME="pls-dockling-service"
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/pls-dockling-service:${IMAGE_TAG}"

          EXISTS=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query name -o tsv 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            STATE=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query properties.provisioningState -o tsv 2>/dev/null || echo "Unknown")
            echo "$APP_NAME provisioningState=$STATE"
            if [ "$STATE" = "Failed" ]; then
              echo "Deleting failed app $APP_NAME so we can recreate cleanly..."
              az containerapp delete -g "$RESOURCE_GROUP" -n "$APP_NAME" --yes
              EXISTS=""
            fi
          fi

          if [ -n "$EXISTS" ]; then
            az containerapp registry set \
              -n "$APP_NAME" \
              -g "$RESOURCE_GROUP" \
              --server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password "${{ secrets.ACR_PASSWORD }}"

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE"
          else
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENV" \
              --image "$IMAGE" \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}" \
              --ingress internal \
              --target-port 80
          fi

      - name: Set Docling URL
        run: |
          echo "DOCLING_URL=http://pls-dockling-service:80" >> $GITHUB_ENV

      # 1) Deploy Summarization FIRST (internal) so we can resolve its internal URL
      - name: Deploy/Update Summarization Service (internal)
        run: |
          set -e
          APP_NAME="pls-summarization-service"
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/pls-summarization-service:${IMAGE_TAG}"

          EXISTS=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query name -o tsv 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            STATE=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query properties.provisioningState -o tsv 2>/dev/null || echo "Unknown")
            echo "$APP_NAME provisioningState=$STATE"
            if [ "$STATE" = "Failed" ]; then
              echo "Deleting failed app $APP_NAME so we can recreate cleanly..."
              az containerapp delete -g "$RESOURCE_GROUP" -n "$APP_NAME" --yes
              EXISTS=""
            fi
          fi

          if [ -n "$EXISTS" ]; then
            az containerapp registry set \
              -n "$APP_NAME" \
              -g "$RESOURCE_GROUP" \
              --server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password "${{ secrets.ACR_PASSWORD }}"

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --set-env-vars \
                ASPNETCORE_ENVIRONMENT=Production \
                Storage__Provider=Blob \
                Storage__Blob__ConnectionString="${{ secrets.STORAGE_BLOB_CONNECTION }}" \
                Storage__Blob__Container="${{ secrets.STORAGE_BLOB_CONTAINER }}" \
                ConnectionStrings__Postgres="${{ secrets.POSTGRES_CONN }}" \
                DOCLING_URL="$DOCLING_URL" \
                RAG_VECTORSTORE=azure \
                RAG_EMBEDDINGS=azure \
                AZURE_SEARCH_ENDPOINT="${{ secrets.AZURE_SEARCH_ENDPOINT }}" \
                AZURE_SEARCH_INDEX_NAME="${{ secrets.AZURE_SEARCH_INDEX_NAME }}" \
                AZURE_SEARCH_KEY="${{ secrets.AZURE_SEARCH_KEY }}" \
                AZURE_OPENAI_EMBEDDING_DEPLOYMENT="${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}" \
                AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
                AZURE_OPENAI_KEY="${{ secrets.AZURE_OPENAI_KEY }}" \
                AZURE_OPENAI_DEPLOYMENT_PROMPT="${{ secrets.AZURE_OPENAI_DEPLOYMENT_PROMPT }}" \
                AZURE_OPENAI_DEPLOYMENT_FINETUNE="${{ secrets.AZURE_OPENAI_DEPLOYMENT_FINETUNE }}" \
                AZURE_OPENAI_DEPLOYMENT_AGENT="${{ secrets.AZURE_OPENAI_DEPLOYMENT_AGENT }}" \
                AZURE_OPENAI_DEPLOYMENT_IMAGE="${{ secrets.AZURE_OPENAI_DEPLOYMENT_IMAGE }}"
          else
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENV" \
              --image "$IMAGE" \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}" \
              --ingress internal \
              --target-port 8080 \
              --env-vars \
                ASPNETCORE_ENVIRONMENT=Production \
                Storage__Provider=Blob \
                Storage__Blob__ConnectionString="${{ secrets.STORAGE_BLOB_CONNECTION }}" \
                Storage__Blob__Container="${{ secrets.STORAGE_BLOB_CONTAINER }}" \
                ConnectionStrings__Postgres="${{ secrets.POSTGRES_CONN }}" \
                DOCLING_URL="$DOCLING_URL" \
                RAG_VECTORSTORE=azure \
                RAG_EMBEDDINGS=azure \
                AZURE_SEARCH_ENDPOINT="${{ secrets.AZURE_SEARCH_ENDPOINT }}" \
                AZURE_SEARCH_INDEX_NAME="${{ secrets.AZURE_SEARCH_INDEX_NAME }}" \
                AZURE_SEARCH_KEY="${{ secrets.AZURE_SEARCH_KEY }}" \
                AZURE_OPENAI_EMBEDDING_DEPLOYMENT="${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}" \
                AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
                AZURE_OPENAI_KEY="${{ secrets.AZURE_OPENAI_KEY }}" \
                AZURE_OPENAI_DEPLOYMENT_PROMPT="${{ secrets.AZURE_OPENAI_DEPLOYMENT_PROMPT }}" \
                AZURE_OPENAI_DEPLOYMENT_FINETUNE="${{ secrets.AZURE_OPENAI_DEPLOYMENT_FINETUNE }}" \
                AZURE_OPENAI_DEPLOYMENT_AGENT="${{ secrets.AZURE_OPENAI_DEPLOYMENT_AGENT }}" \
                AZURE_OPENAI_DEPLOYMENT_IMAGE="${{ secrets.AZURE_OPENAI_DEPLOYMENT_IMAGE }}"
          fi

      - name: Resolve Summarization internal URL
        run: |
          FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n pls-summarization-service --query properties.configuration.ingress.fqdn -o tsv)
          echo "SUMMARIZATION_URL=https://${FQDN}" >> $GITHUB_ENV

      # 2) Deploy Orchestrator (internal) using SUMMARIZATION_URL
      - name: Deploy/Update Orchestrator Service (internal)
        run: |
          set -e
          APP_NAME="pls-orchestrator-service"
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/pls-orchestrator-service:${IMAGE_TAG}"

          EXISTS=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query name -o tsv 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            STATE=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query properties.provisioningState -o tsv 2>/dev/null || echo "Unknown")
            echo "$APP_NAME provisioningState=$STATE"
            if [ "$STATE" = "Failed" ]; then
              echo "Deleting failed app $APP_NAME so we can recreate cleanly..."
              az containerapp delete -g "$RESOURCE_GROUP" -n "$APP_NAME" --yes
              EXISTS=""
            fi
          fi

          if [ -n "$EXISTS" ]; then
            az containerapp registry set \
              -n "$APP_NAME" \
              -g "$RESOURCE_GROUP" \
              --server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password "${{ secrets.ACR_PASSWORD }}"

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --set-env-vars \
                ASPNETCORE_ENVIRONMENT=Production \
                ConnectionStrings__Postgres="${{ secrets.POSTGRES_CONN }}" \
                SummarizationService__BaseUrl="$SUMMARIZATION_URL"
          else
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENV" \
              --image "$IMAGE" \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}" \
              --ingress internal \
              --target-port 8080 \
              --env-vars \
                ASPNETCORE_ENVIRONMENT=Production \
                ConnectionStrings__Postgres="${{ secrets.POSTGRES_CONN }}" \
                SummarizationService__BaseUrl="$SUMMARIZATION_URL"
          fi

      # 3) Deploy Document Service (external) using SUMMARIZATION_URL and LocalStorage
      - name: Deploy/Update Document Service (external)
        run: |
          set -e
          APP_NAME="pls-document-service"
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/pls-document-service:${IMAGE_TAG}"

          EXISTS=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query name -o tsv 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            STATE=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query properties.provisioningState -o tsv 2>/dev/null || echo "Unknown")
            echo "$APP_NAME provisioningState=$STATE"
            if [ "$STATE" = "Failed" ]; then
              echo "Deleting failed app $APP_NAME so we can recreate cleanly..."
              az containerapp delete -g "$RESOURCE_GROUP" -n "$APP_NAME" --yes
              EXISTS=""
            fi
          fi

          if [ -n "$EXISTS" ]; then
            az containerapp registry set \
              -n "$APP_NAME" \
              -g "$RESOURCE_GROUP" \
              --server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password "${{ secrets.ACR_PASSWORD }}"

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --set-env-vars \
                ASPNETCORE_ENVIRONMENT=Production \
                Database__RunMigrations=true \
                ConnectionStrings__Postgres="${{ secrets.POSTGRES_CONN }}" \
                SummarizationService__BaseUrl="$SUMMARIZATION_URL" \
                Storage__Provider=Blob \
                Storage__Blob__ConnectionString="${{ secrets.STORAGE_BLOB_CONNECTION }}" \
                Storage__Blob__Container="${{ secrets.STORAGE_BLOB_CONTAINER }}"
          else
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENV" \
              --image "$IMAGE" \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}" \
              --ingress external \
              --target-port 8080 \
              --env-vars \
                ASPNETCORE_ENVIRONMENT=Production \
                Database__RunMigrations=true \
                ConnectionStrings__Postgres="${{ secrets.POSTGRES_CONN }}" \
                SummarizationService__BaseUrl="$SUMMARIZATION_URL" \
                Storage__Provider=Blob \
                Storage__Blob__ConnectionString="${{ secrets.STORAGE_BLOB_CONNECTION }}" \
                Storage__Blob__Container="${{ secrets.STORAGE_BLOB_CONTAINER }}"
          fi

      # 4) Deploy Web (external)
      - name: Deploy/Update Web (external)
        run: |
          set -e
          APP_NAME="pls-web"
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/pls-web:${IMAGE_TAG}"

          EXISTS=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query name -o tsv 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            STATE=$(az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --query properties.provisioningState -o tsv 2>/dev/null || echo "Unknown")
            echo "$APP_NAME provisioningState=$STATE"
            if [ "$STATE" = "Failed" ]; then
              echo "Deleting failed app $APP_NAME so we can recreate cleanly..."
              az containerapp delete -g "$RESOURCE_GROUP" -n "$APP_NAME" --yes
              EXISTS=""
            fi
          fi

          if [ -n "$EXISTS" ]; then
            az containerapp registry set \
              -n "$APP_NAME" \
              -g "$RESOURCE_GROUP" \
              --server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password "${{ secrets.ACR_PASSWORD }}"

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --set-env-vars \
                API_BASE_URL="${{ secrets.API_BASE_URL }}"

            az containerapp ingress update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --target-port 80
          else
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENV" \
              --image "$IMAGE" \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}" \
              --ingress external \
              --target-port 80 \
              --env-vars \
                API_BASE_URL="${{ secrets.API_BASE_URL }}"
          fi

      - name: Print public URLs
        run: |
          echo "pls-web:"
          az containerapp show -g "$RESOURCE_GROUP" -n pls-web --query properties.configuration.ingress.fqdn -o tsv || true
          echo "pls-document-service:"
          az containerapp show -g "$RESOURCE_GROUP" -n pls-document-service --query properties.configuration.ingress.fqdn -o tsv || true
